name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: verify / publish / pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 v$VERSION 不一致"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          TGZ="$(npm pack --silent)"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "packed $TGZ"

      - name: Checksums
        run: |
          TGZ="${{ steps.pack.outputs.tgz }}"
          sha256sum "$TGZ" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # npm Trusted Publisher（OIDC）：不需要 NPM_TOKEN。依赖本 job 的
      # id-token: write，以及 npmjs.com 上 @hmydk/dsh-notify 的
      # Settings → Trusted Publisher 配置的 HMYDK/dsh-notify + release.yml。
      # 不设置 registry-url / NODE_AUTH_TOKEN：避免 setup-node 生成带空 token
      # 的 .npmrc 而让 npm 走 token 鉴权。
      - name: Publish to npm
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --access public --provenance

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.pack.outputs.tgz }}" \
            SHA256SUMS.txt
