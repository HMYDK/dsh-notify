# dsh-notify bundle patch.
#
# One dual-face plugin row: the Host half ("./index.js") watches agent status and
# approval requests and streams notification events over the loopback web
# server; the browser half ("./client.js", declared by `dsh.client` in
# package.json) shows the native notification and applies the focus condition.
#
# The values below are defaults only: change them from Settings → Notifications
# in the GUI (that page writes back through the profile's cordis.patch.yml), or
# override the entry from the profile patch with `- id: dsh-notify` + `config:`.
- insert:
    - id: dsh-notify
      name: '@hmydk/dsh-notify'
      config:
        enabled: true
        condition: unfocused
        events:
          - turn-complete
          - approval-requested
        approvalGraceMs: 2000
